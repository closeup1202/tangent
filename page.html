<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tangent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 28 C10 18 14 12 24 6' stroke='%238B6B4E' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M15 14 C12 10 13 7 16 5 C18 9 18 12 15 14Z' fill='%23D97757'/%3E%3Cpath d='M19 11 C23 10 26 12 27 15 C23 16 20 14 19 11Z' fill='%23D97757' opacity='.75'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #FAF9F5; --surface: #FFFFFF; --sunken: #F0EEE6; --line: #E6E1D5;
  --text: #1F1E1D; --muted: #75716A; --faint: #A8A399;
  --accent: #D97757; --accent-strong: #C15F3C; --accent-soft: #F7E4DA; --accent-ink: #FFFFFF;
  --twig: #8B6B4E; --twig-soft: #D9CBB9; --leaf: #D97757; --mark: rgba(217,119,87,.16);
  --shadow: 0 1px 2px rgba(31,30,29,.06), 0 8px 24px rgba(31,30,29,.06);
  --code-bg: #F3F0E8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1F1E1D; --surface: #262624; --sunken: #30302D; --line: #3A3935;
    --text: #ECEAE3; --muted: #A39F96; --faint: #6F6B64;
    --accent: #E08A6A; --accent-strong: #D97757; --accent-soft: #3B2A22; --accent-ink: #1F1E1D;
    --twig: #B8977A; --twig-soft: #4E4237; --leaf: #E08A6A; --mark: rgba(224,138,106,.22);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --code-bg: #2C2B28;
  }
}
:root[data-theme="dark"] {
  --bg: #1F1E1D; --surface: #262624; --sunken: #30302D; --line: #3A3935;
  --text: #ECEAE3; --muted: #A39F96; --faint: #6F6B64;
  --accent: #E08A6A; --accent-strong: #D97757; --accent-soft: #3B2A22; --accent-ink: #1F1E1D;
  --twig: #B8977A; --twig-soft: #4E4237; --leaf: #E08A6A; --mark: rgba(224,138,106,.22);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --code-bg: #2C2B28;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

/* ---------- header ---------- */
header {
  display: flex; align-items: center; gap: 12px; padding: 10px 20px;
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; }
.brand small { color: var(--muted); font-weight: 400; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--leaf); flex: none; animation: live 2.4s ease-in-out infinite; }
.live-dot.off { background: var(--faint); animation: none; }
@keyframes live { 50% { opacity: .35; } }
.ver { font-size: 11px; color: var(--faint); text-decoration: none; font-weight: 500; margin-left: -2px; }
.ver:hover { color: var(--accent-strong); }
.btitle[data-rename] { cursor: text; border-radius: 4px; }
.btitle[data-rename]:hover { box-shadow: 0 1px 0 var(--twig-soft); }
.panel-head input.rename { flex: 1; min-width: 0; height: 28px; font: inherit; font-size: 14px; font-weight: 600; border: 1px solid var(--accent); border-radius: 6px; padding: 0 8px; background: var(--bg); color: var(--text); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.blist .t b { font-weight: 650; }
.session-title { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.hgroup { display: flex; gap: 8px; align-items: center; }
select, .search {
  height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  color: var(--text); padding: 0 10px; font: inherit; font-size: 13px; outline: none;
}
select { max-width: 260px; }
.search { width: 180px; }
select:focus, .search:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.icon-btn {
  height: 32px; min-width: 32px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px;
}
.icon-btn:hover { border-color: var(--twig-soft); background: var(--sunken); }
.icon-btn svg { width: 16px; height: 16px; }

/* ---------- layout ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(420px, 34vw, 680px); min-height: 0; overflow: hidden; }
.thread-wrap { overflow-y: auto; overflow-x: hidden; min-height: 0; min-width: 0; scroll-behavior: smooth; }
body { overflow: hidden; }
/* Grid items grow to their content width by default; keep wide tables/code from pushing the panel out */
.panel, .panel > *, .row > *, .bmsg, .bmsg .b { min-width: 0; }
.panel { overflow: hidden; }
.thread { max-width: 860px; margin: 0 auto; padding: 28px 24px 120px; }

/* ---------- messages + trunk ---------- */
.row { display: grid; grid-template-columns: minmax(0, 1fr) 72px; position: relative; }
.gutter { position: relative; }
.gutter::before {               /* trunk: thin brown line running down the whole conversation */
  content: ""; position: absolute; left: 22px; top: 0; bottom: 0; width: 1.5px; background: var(--twig-soft);
}
.row:first-child .gutter::before { top: 22px; }
.node { position: absolute; left: 18px; top: 18px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--twig-soft); }
.row.has-branch .node { border-color: var(--twig); background: var(--twig); }
.twigs { position: absolute; left: 0; top: 0; width: 72px; height: 90px; overflow: visible; pointer-events: none; }
.twig-hit { pointer-events: all; cursor: pointer; }
.twig-hit path.stem { stroke: var(--twig); stroke-width: 1.4; fill: none; stroke-linecap: round; transition: stroke-width .15s; }
.twig-hit path.leaf { fill: var(--leaf); opacity: .85; transition: transform .15s; transform-box: fill-box; transform-origin: 0% 100%; }
.twig-hit:hover path.stem, .twig-hit.on path.stem { stroke-width: 2.2; }
.twig-hit:hover path.leaf, .twig-hit.on path.leaf { transform: scale(1.18); opacity: 1; }
.twig-count { position: absolute; left: 30px; top: 84px; font-size: 11px; color: var(--twig); font-weight: 600; }

.msg { padding: 10px 0 18px; position: relative; }
.msg .who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.msg .who b { color: var(--text); font-weight: 600; }
.msg .who .spark { width: 14px; height: 14px; color: var(--accent); }
.msg.user .body { background: var(--sunken); border-radius: 14px; padding: 10px 14px; display: inline-block; max-width: 100%; }
.msg.user .bodywrap { text-align: left; }
.msg .body { overflow-wrap: anywhere; }
.msg.flash .body { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--accent-soft); } 100% { box-shadow: 0 0 0 0 transparent; } }
.msg .act {
  position: absolute; right: 0; top: 6px; opacity: 0; transition: opacity .15s;
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--twig);
}
.msg:hover .act { opacity: 1; }
.msg .act:hover { border-color: var(--twig); }
.msg .act svg { width: 13px; height: 13px; }
.hidden { display: none !important; }
mark.twig-mark { background: var(--mark); color: inherit; border-bottom: 1.5px solid var(--twig); border-radius: 2px; cursor: pointer; padding: 0 1px; }

/* ---------- markdown ---------- */
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: .55em 0; }
.md h1, .md h2, .md h3, .md h4 { margin: 1.1em 0 .45em; line-height: 1.35; letter-spacing: -.01em; }
.md h1 { font-size: 1.3em; } .md h2 { font-size: 1.16em; } .md h3 { font-size: 1.05em; } .md h4 { font-size: 1em; }
.md ul, .md ol { margin: .45em 0; padding-left: 1.4em; }
.md li { margin: .18em 0; }
.md li::marker { color: var(--twig); }
.md code { font: .88em/1.5 "SF Mono", Menlo, "Cascadia Code", Consolas, "D2Coding", monospace; background: var(--code-bg); padding: .12em .38em; border-radius: 5px; }
.md pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: .7em 0; }
.md pre code { background: none; padding: 0; font-size: .84em; white-space: pre; }
.md blockquote { margin: .6em 0; padding: .1em 0 .1em 14px; border-left: 2px solid var(--twig-soft); color: var(--muted); }
.md table { border-collapse: collapse; margin: .7em 0; font-size: .92em; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--sunken); font-weight: 600; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
.md a { color: var(--accent-strong); }

/* ---------- floating "Branch" button ---------- */
.float-branch {
  position: fixed; z-index: 20; display: none; align-items: center; gap: 6px;
  padding: 6px 12px 6px 9px; border: 0; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow);
}
.float-branch svg { width: 16px; height: 16px; }
.float-branch:hover { background: var(--accent-strong); }

/* ---------- panel ---------- */
.panel { border-left: 1px solid var(--line); background: var(--surface); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
.panel-head { padding: 14px 18px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 650; flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.panel-head h2 span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel-head svg.twig-ico { width: 20px; height: 20px; flex: none; }
.panel-body { overflow-y: auto; padding: 16px 18px; min-height: 0; }
.quote {
  position: relative; margin: 0 0 16px; padding: 10px 12px 10px 30px; border-radius: 10px;
  background: var(--sunken); font-size: 13px; color: var(--muted); cursor: pointer;
}
.quote svg { position: absolute; left: 6px; top: 8px; width: 20px; height: 32px; }
.quote .q { color: var(--text); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
.quote .src { font-size: 11px; margin-top: 6px; color: var(--faint); }
.bmsg { margin: 0 0 14px; }
.bmsg.user { display: flex; justify-content: flex-end; }
.bmsg.user .b { background: var(--accent-soft); border-radius: 14px 14px 4px 14px; padding: 8px 12px; max-width: 88%; white-space: pre-wrap; overflow-wrap: anywhere; }
.bmsg.assistant .b { font-size: 14.5px; }
.bmsg.error .b { color: #B3261E; font-size: 13px; background: rgba(179,38,30,.08); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }
.cursor { display: inline-block; width: 7px; height: 1em; vertical-align: -2px; background: var(--accent); border-radius: 1px; animation: blink 1s steps(2) infinite; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }
.thinking { display: inline-flex; gap: 4px; padding: 6px 0; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--twig); opacity: .35; animation: dot 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 30% { opacity: 1; transform: translateY(-2px); } }

.composer { border-top: 1px solid var(--line); padding: 12px 14px 14px; }
.attach { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; }
.attach:empty { display: none; }
.attach .th { position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--sunken); }
.attach .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.attach .th button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(31,30,29,.72); color: #fff; font-size: 12px; line-height: 20px; padding: 0; }
.composer.dragging .box { border-color: var(--twig); box-shadow: 0 0 0 3px var(--accent-soft); border-style: dashed; }
.clip { width: 30px; height: 34px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; flex: none; border-radius: 8px; }
.clip:hover { color: var(--accent-strong); background: var(--sunken); }
.clip svg { width: 18px; height: 18px; }
.bimgs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-bottom: 6px; }
.bimgs a { display: block; }
.bimgs img { max-width: 180px; max-height: 140px; border-radius: 10px; border: 1px solid var(--line); display: block; }
.composer .box { border: 1px solid var(--line); border-radius: 14px; background: var(--bg); padding: 8px 8px 8px 12px; display: flex; gap: 8px; align-items: flex-end; }
.composer .box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { flex: 1; border: 0; outline: none; resize: none; background: transparent; color: var(--text); font: inherit; font-size: 14px; line-height: 1.5; max-height: 180px; min-height: 22px; padding: 3px 0; box-shadow: none !important; }
.send { width: 34px; height: 34px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .4; cursor: default; }
.send svg { width: 16px; height: 16px; }
.composer .tools { display: flex; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--faint); align-items: center; }
.composer .tools .sp { flex: 1; }
.link-btn { white-space: nowrap; flex: none; border: 0; background: none; color: var(--muted); font-size: 12px; padding: 2px 4px; border-radius: 6px; display: inline-flex; gap: 4px; align-items: center; }
.link-btn:hover { color: var(--accent-strong); background: var(--sunken); }
.link-btn svg { width: 14px; height: 14px; }

.mbtn { height: 24px; padding: 0 8px; font-size: 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mbtn:hover { border-color: var(--twig-soft); color: var(--text); }
.mbtn svg { width: 12px; height: 12px; flex: none; }
.composer { position: relative; }
.mpop { position: absolute; left: 12px; bottom: calc(100% - 36px); width: min(380px, calc(100% - 24px)); z-index: 25; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; }
.mpop h4 { margin: 4px 8px 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
.mpop .opt { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.mpop .opt .ck { color: var(--accent); font-weight: 700; }
.mpop .opt .sub { color: var(--faint); font-size: 11.5px; }
.mpop .opt.hl { background: var(--sunken); }
.mpop .eff { border-top: 1px solid var(--line); margin-top: 6px; padding: 9px 8px 5px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.mpop .eff .lbl { color: var(--muted); }
.mpop .eff button { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0; line-height: 1; }
.mpop .eff button:disabled { opacity: .35; }
.mpop .dots { display: inline-flex; gap: 3px; }
.mpop .dots i { width: 14px; height: 6px; border-radius: 3px; background: var(--line); }
.mpop .dots i.on { background: var(--twig); }
.mpop .eff .val { font-weight: 600; min-width: 64px; }
.mpop .keys { font-size: 11px; color: var(--faint); padding: 2px 8px 4px; }
select.mini { height: 24px; padding: 0 6px; font-size: 12px; border-radius: 6px; max-width: 120px; color: var(--muted); background: var(--surface); }
.float-branch kbd { font: 600 10.5px/1 "SF Mono", Menlo, Consolas, monospace; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,.25); margin-left: 2px; }
.list-note { font-size: 12px; color: var(--muted); margin: 0 4px 10px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); white-space: nowrap; user-select: none; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle .sw { width: 26px; height: 15px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.toggle .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.toggle input:checked + .sw { background: var(--twig); }
.toggle input:checked + .sw::after { transform: translateX(11px); }
.toggle input:checked ~ span:last-child { color: var(--twig); font-weight: 600; }
.toggle input:focus-visible + .sw { box-shadow: 0 0 0 3px var(--accent-soft); }
.composer .keys { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 11.5px/1.4 "SF Mono", Menlo, Consolas, monospace; color: var(--twig); background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip b { font-family: -apple-system, "Segoe UI", sans-serif; font-weight: 600; }
.modal-bg { position: fixed; inset: 0; background: rgba(20,20,19,.38); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); width: min(620px, 100%); padding: 16px 18px; display: grid; gap: 12px; }
.modal h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.modal h3 svg { width: 20px; height: 20px; }
.modal p { margin: 0; font-size: 12.5px; color: var(--muted); }
.modal textarea { width: 100%; min-height: 200px; max-height: 50vh; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px 12px; font: 13.5px/1.6 inherit; resize: vertical; }
.modal .row-btns { display: flex; justify-content: flex-end; gap: 8px; }
.btn { height: 34px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-strong); }
.btn:disabled { opacity: .45; cursor: default; }
.blist { list-style: none; margin: 0; padding: 0; }
.blist li { position: relative; padding: 10px 12px 10px 34px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; }
.blist li:hover { background: var(--sunken); }
.blist li svg { position: absolute; left: 6px; top: 9px; width: 22px; height: 28px; }
.blist .t { font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.blist .m { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
.empty { color: var(--muted); font-size: 13.5px; text-align: center; padding: 40px 12px; }
.empty svg { width: 120px; height: 90px; display: block; margin: 0 auto 14px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
.toast.on { opacity: .94; }

/* The panel only collapses on narrow screens; on wide screens it is part of the layout, so no close button */
@media (min-width: 981px) { #closePanel { display: none; } }
@media (max-width: 980px) {
  .main { grid-template-columns: 1fr; }
  .panel { position: fixed; inset: auto 0 0 0; height: 62vh; border-left: 0; border-top: 1px solid var(--line); box-shadow: var(--shadow); z-index: 10; border-radius: 16px 16px 0 0; }
  .panel.closed { display: none; }
  .search { width: 120px; }
  .session-title { display: none; }
}
@media (max-width: 560px) {
  header { padding: 8px 16px; flex-wrap: wrap; }
  .thread { padding: 20px 16px 120px; }
  .row { grid-template-columns: minmax(0, 1fr) 48px; }
  select { max-width: 150px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 28 C10 18 14 12 24 6" stroke="var(--twig)" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M15 14 C12 10 13 7 16 5 C18 9 18 12 15 14Z" fill="var(--leaf)"/><path d="M19 11 C23 10 26 12 27 15 C23 16 20 14 19 11Z" fill="var(--leaf)" opacity=".7"/></svg>

/* ---------- markdown (tiny built-in renderer; all input is escaped first) ---------- */
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function inline(s) {
  // Pull code spans out first (so bold can contain code), convert the rest, then put them back
  const codes = [];
  s = s.replace(/\u0000/g, ''); // NUL is our placeholder marker; text containing it must not break rendering
  let t = esc(s.replace(/`([^`\n]+)`/g, (_, c) => '\u0000' + (codes.push(c) - 1) + '\u0000'));
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<em>$2</em>');
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, n) => '<code>' + esc(codes[n]) + '</code>');
}
function md(src) {
  const L = src.replace(/\r/g, '').split('\n');
  const out = [];
  let i = 0;
  const isBlockStart = (l) => /^\s*(`{3,}|~{3,})/.test(l) || /^#{1,4}\s/.test(l) || /^\s*>/.test(l) || /^\s*([-*+]|\d+[.)])\s+/.test(l) || /^\s*\|.*\|\s*$/.test(l) || /^\s*(-{3,}|\*{3,})\s*$/.test(l);
  while (i < L.length) {
    const l = L[i];
    const fence = l.match(/^\s*(`{3,}|~{3,})/);
    if (fence) {
      const f = fence[1]; const buf = []; i++;
      while (i < L.length && !L[i].trim().startsWith(f)) buf.push(L[i++]);
      i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
    }
    if (!l.trim()) { i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i + 1])) {
      const cells = (r) => r.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map((c) => inline(c.trim()));
      let t = '<table><thead><tr>' + cells(l).map((c) => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) t += '<tr>' + cells(L[i++]).map((c) => `<td>${c}</td>`).join('') + '</tr>';
      out.push(t + '</tbody></table>'); continue;
    }
    if (/^\s*>/.test(l)) {
      const buf = [];
      while (i < L.length && /^\s*>/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/, ''));
      out.push('<blockquote>' + md(buf.join('\n')) + '</blockquote>'); continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const stack = []; let html = '';
      while (i < L.length) {
        const m = L[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (!m) {
          if (L[i].trim() && /^\s{2,}/.test(L[i]) && stack.length) { html = html.replace(/<\/li>$/, '') + '<br>' + inline(L[i].trim()) + '</li>'; i++; continue; }
          break;
        }
        const ind = m[1].replace(/\t/g, '  ').length, tag = /\d/.test(m[2]) ? 'ol' : 'ul';
        while (stack.length && ind < stack[stack.length - 1].ind) html += `</${stack.pop().tag}>`;
        if (!stack.length || ind > stack[stack.length - 1].ind) {
          if (stack.length) html = html.replace(/<\/li>$/, '');
          stack.push({ ind, tag }); html += `<${tag}>`;
        }
        html += '<li>' + inline(m[3]) + '</li>'; i++;
        if (i < L.length && !L[i].trim() && i + 1 < L.length && /^\s*([-*+]|\d+[.)])\s+/.test(L[i + 1])) i++;
      }
      while (stack.length) { const s = stack.pop(); html += `</${s.tag}>` + (stack.length ? '</li>' : ''); }
      out.push(html); continue;
    }
    const buf = [];
    while (i < L.length && L[i].trim() && !(buf.length && isBlockStart(L[i]))) buf.push(L[i++]);
    out.push('<p>' + buf.map(inline).join('<br>') + '</p>');
  }
  return out.join('');
}

// Strip markdown symbols for one-line previews
const plain = (s) => s.replace(/[*_`#>|~]+/g, '').replace(/\s+/g, ' ').trim();

/* ---------- drawings ---------- */
const SPARK = '<svg class="spark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 6.2L20 6l-4.2 5L22 12l-6.2 1.6L20 18l-5-4.2L12 22l-1.6-6.2L4 18l4.2-5L2 12l6.2-1.6L4 6l5 4.2z"/></svg>';
const TWIG_ICO = '<svg class="twig-ico" viewBox="0 0 24 24" fill="none"><path d="M5 21 C7 14 10 10 18 5" stroke="var(--twig)" stroke-width="1.8" stroke-linecap="round"/><path d="M11 11 C9 8 10 5 12 4 C14 7 13 10 11 11Z" fill="var(--leaf)"/><path d="M14 8.5 C17 8 19 9.5 19.5 12 C16.5 12.5 14.8 11 14 8.5Z" fill="var(--leaf)" opacity=".7"/></svg>';
const SMALL_TWIG = '<svg viewBox="0 0 22 30" fill="none"><path d="M4 30 C4 20 8 12 18 6" stroke="var(--twig)" stroke-width="1.4" stroke-linecap="round"/><path d="M11 13 C9 10 10 6 12.5 5 C14 8 13.5 11 11 13Z" fill="var(--leaf)"/></svg>';
function twigSvg(branches, openId) {
  // Thin twigs curving out of the trunk (x=23). Draw at most 3 and show a count.
  const shown = branches.slice(0, 3);
  const parts = shown.map((b, k) => {
    const y0 = 23, y1 = 36 + k * 15, x1 = 54 - k * 4;
    const d = `M23 ${y0} C 26 ${y1 - 4} ${34} ${y1} ${x1} ${y1 - 6}`;
    const leaf = `M${x1} ${y1 - 6} c 3 -6 8 -7 12 -6 c -1 5 -7 8 -12 6Z`;
    return `<g class="twig-hit${b.id === openId ? ' on' : ''}" data-b="${b.id}"><path class="stem" d="${d}"/><path class="leaf" d="${leaf}"/><path d="${d}" stroke="transparent" stroke-width="12" fill="none"/></g>`;
  }).join('');
  return `<svg class="twigs" viewBox="0 0 72 90">${parts}</svg>` + (branches.length > 1 ? `<span class="twig-count">${branches.length}</span>` : '');
}

/* ---------- thread ---------- */
function fmtTime(ts) { if (!ts) return ''; const d = new Date(ts); return isNaN(d) ? '' : d.toLocaleString(LOCALE(), { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
// Only top-level branches grow from the main thread; nested ones hang off their parent branch
function branchesOf(i) { return state.branches.filter((b) => b.anchor === i && !b.parent); }
function childrenOf(id) { return state.branches.filter((b) => b.parent === id); }
function branchTitle(b) { return b.title || (b.messages.length ? b.messages[0].text.split('\n')[0] : t('newBranch')); }
function defaultTitle(b) { return b.messages.length ? b.messages[0].text.split('\n')[0] : t('newBranch'); }

// Highlight `text` inside `container` and tag it with the branch id (best effort: first line, first match)
function markText(container, text, id) {
  const needle = (text || '').split('\n').map((s) => s.trim()).find((s) => s.length > 0);
  if (!container || !needle) return;
  const probe = needle.slice(0, 80);
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    const k = n.nodeValue.indexOf(probe);
    if (k < 0 || n.parentElement.closest('mark')) continue;
    const r = document.createRange(); r.setStart(n, k); r.setEnd(n, k + probe.length);
    const m = document.createElement('mark'); m.className = 'twig-mark'; m.dataset.b = id;
    try { r.surroundContents(m); } catch {}
    return;
  }
}

function rowHtml(it, q) {
  const bs = branchesOf(it.i);
  const hide = q && !it.text.toLowerCase().includes(q) ? ' hidden' : '';
  const who = it.role === 'user' ? '<b>' + t('you') + '</b>' : SPARK + '<b>Claude</b>';
  return `<div class="row${bs.length ? ' has-branch' : ''}${hide}" data-i="${it.i}">
    <div class="msg ${it.role}" data-i="${it.i}">
      <div class="who">${who}<span>${fmtTime(it.time)}</span></div>
      <div class="bodywrap"><div class="body md">${md(it.text)}</div></div>
      <button class="act" data-act="${it.i}" title="${t('branchMsgTitle')}">${SMALL_TWIG.replace('viewBox="0 0 22 30"', 'viewBox="0 0 22 30" width="13" height="13"')}${t('branchMsg')}</button>

/* ---------- live refresh: poll the session file, re-render only what changed ---------- */
const live = { mtime: 0, size: 0, busy: false };
function selectionRow() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || !sel.toString().trim()) return -1;
  const n = sel.getRangeAt(0).startContainer;
  const row = (n.nodeType === 1 ? n : n.parentElement).closest('.row');
  return row ? Number(row.dataset.i) : -1;
}
function applyThread(items) {
  const old = state.items;
  let k = 0;
  while (k < old.length && k < items.length && old[k].role === items[k].role && old[k].text === items[k].text) k++;
  if (k === old.length && k === items.length) return true;
  const sr = selectionRow();
  if (sr >= k) return false; // the user is selecting text in a row that would change; try again later
  const wrap = $('#threadWrap');
  const nearBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 160;
  state.items = items;
  const thread = $('#thread');
  if (!old.length) thread.innerHTML = '';
  thread.querySelectorAll('.row').forEach((r) => { if (Number(r.dataset.i) >= k) r.remove(); });
  const q = $('#search').value.trim().toLowerCase();
  thread.insertAdjacentHTML('beforeend', items.slice(k).map((it) => rowHtml(it, q)).join(''));
  markSelections(k);
  if (nearBottom) { wrap.style.scrollBehavior = 'auto'; wrap.scrollTop = wrap.scrollHeight; wrap.style.scrollBehavior = ''; }
  return true;
}
async function pollLive() {
  if (live.busy || document.hidden || !state.session) return;
  live.busy = true;
  const sess = state.session; // drop the result if the user switches session while this poll is in flight
  try {
    // Items fetched earlier but held back because the user was selecting text: apply them first, no refetch
    if (live.held && live.held.sess === sess && applyThread(live.held.items)) live.held = null;
    const s = await (await api('/api/stat?session=' + encodeURIComponent(sess))).json();
    if (sess === state.session && (s.mtime !== live.mtime || s.size !== live.size)) {
      const data = await (await api('/api/thread?session=' + encodeURIComponent(sess))).json();
      if (sess === state.session) {
        state.mainSpec = data.mainSpec || state.mainSpec;
        live.mtime = s.mtime; live.size = s.size; $('#sessionTitle').textContent = data.title || '';
        live.held = applyThread(data.items) ? null : { sess, items: data.items };

}
setInterval(pollLive, 2500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollLive(); });

function chipsHtml(tools) {

function readToolsDefault() { try { return localStorage.getItem('tangent-readtools') === '1'; } catch { return false; } }

/* ---------- export a branch as Markdown (client-side download) ---------- */
function exportBranch(b) {
  const quoteSrc = b.selection || b.anchorPreview || '';
  const L = [`# ${plain(branchTitle(b))}`, '', ...quoteSrc.split('\n').map((l) => '> ' + l), '',
    `_Tangent branch · ${new Date(b.createdAt || Date.now()).toLocaleString(LOCALE())} · session ${state.session}_`, ''];
  for (const m of b.messages) {
    if (m.role === 'error') continue;

    else {

      L.push(m.text, '');

  a.href = URL.createObjectURL(blob);
  a.download = `tangent-${b.id}.md`;

/* ---------- send a question (NDJSON streaming) ---------- */
async function sendQuestion() {
  const input = $('#input');
  const question = input.value.trim();
  if (!question && !attach.length) return;
  const draft = state.draft;
  const b = draft || state.branches.find((x) => x.id === state.open);
  if (!b) return;
  const key = b.id || 'draft';
  if (state.busy.has(key)) return;
  state.busy.add(key);
  input.value = ''; autosize();
  const readTools = $('#readTools').checked;
  const model = pick.model, effort = pick.effort;
  b.readTools = readTools; b.model = model; b.effort = effort;
  const sent = attach.splice(0); renderAttach();
  const images = sent.map((a) => ({ media_type: a.media_type, data: a.data }));
  b.messages.push({ role: 'user', text: question, images: sent.map((a) => a.url) });
  b._streaming = ''; b._tools = [];
  renderPanel();

  const url = draft ? '/api/branch' : `/api/branch/${b.id}/ask`;
  const payload = !draft ? { session: state.session, question, readTools, model, effort, images }
    : b.parent ? { session: state.session, parent: b.parent, parentMsg: b.parentMsg, selection: b.selection, question, readTools, model, effort, images }
    : { session: state.session, anchor: b.anchor, selection: b.selection, question, readTools, model, effort, images };
  let current = b, raf = 0, streamed = false;
  const sess = state.session; // results for another session must not leak into the one now on screen
  const here = () => state.session === sess;
  const paint = () => { raf = 0; const box = $('#streamMsg'); if (here() && box && (state.open === current.id || state.draft === current)) { box.innerHTML = streamInner(current); const pb = $('#panelBody'); pb.scrollTop = pb.scrollHeight; } };
  try {
    const r = await api(url, { method: 'POST', body: JSON.stringify(payload) });
    streamed = true;
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let k;
      while ((k = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, k); buf = buf.slice(k + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (!here()) continue; // keep draining the stream, but don't touch the current screen
        if (ev.type === 'gone') { state.branches = state.branches.filter((x) => x.id !== ev.id); current = null; continue; }
        if (ev.type === 'branch') {
          const nb = { ...ev.branch, _streaming: '', _tools: [] };
          if (draft) { state.draft = null; state.open = nb.id; state.branches.push(nb); state.busy.delete('draft'); state.busy.add(nb.id); }
          else Object.assign(current, { sessionId: ev.branch.sessionId });
          if (draft) { current = nb; renderThread(true); renderPanel(); }
        } else if (ev.type === 'delta') {
          current._streaming += ev.text;
          if (!raf) raf = requestAnimationFrame(paint);
        } else if (ev.type === 'tool') {
          (current._tools ||= []).push({ name: ev.name, detail: ev.detail });
          if (!raf) raf = requestAnimationFrame(paint);
        } else if (ev.type === 'done' || ev.type === 'error') {
          // Only update a branch that is still here (it may have been deleted meanwhile)
          const idx = state.branches.findIndex((x) => x.id === ev.branch.id);
          if (idx >= 0) state.branches[idx] = ev.branch;
          current = idx >= 0 ? ev.branch : null;
        }
      }
    }
  } catch (e) {
    if (!streamed && here()) {
      // The server stored nothing (409, network error...): undo the optimistic message so indexes stay
      // in step with the server, and give the question back so it isn't lost
      b.messages.pop();
      if (!$('#input').value) { $('#input').value = question; autosize(); }
      if (!attach.length) { attach.push(...sent); renderAttach(); } // give the images back too
    }
    toast(String(e.message || e).slice(0, 160));
    if (streamed && here()) await resyncBranches();
  } finally {
    state.busy.delete(key); if (current && current.id) state.busy.delete(current.id);
    if (current) { delete current._streaming; delete current._tools; }
    delete b._streaming; delete b._tools;
    if (here()) { renderThread(true); renderPanel(); }
  }
}

// Re-read branches from the server after an interrupted stream so the page matches what was stored
async function resyncBranches() {
  try {
    const data = await (await api('/api/thread?session=' + encodeURIComponent(state.session))).json();
    state.branches = data.branches;
    if (state.open && !state.branches.some((x) => x.id === state.open)) state.open = null;
  } catch {}
}

/* ---------- selection → Branch button ---------- */
const fb = $('#floatBranch');
let pendingSel = null;
document.addEventListener('mouseup', (e) => {

    const sel = window.getSelection();
    const text = sel && sel.toString().trim();
    if (!text || !sel.rangeCount) { fb.style.display = 'none'; pendingSel = null; return; }
    const range = sel.getRangeAt(0);
    const el = (n) => (n.nodeType === 1 ? n : n.parentElement);
    const a = el(range.startContainer).closest('.msg'), b = el(range.endContainer).closest('.msg');
    const pa = el(range.startContainer).closest('.bmsg[data-m]'), pb = el(range.endContainer).closest('.bmsg[data-m]');
    const openB = !state.draft && state.branches.find((x) => x.id === state.open);
    if (a && a === b) pendingSel = { anchor: Number(a.dataset.i), text };
    else if (pa && pa === pb && openB && openB._streaming === undefined) pendingSel = { parent: openB.id, parentMsg: Number(pa.dataset.m), text };
    else { fb.style.display = 'none'; pendingSel = null; return; }

/* ---------- rename a branch: Enter or click away saves, Esc cancels, empty = back to the first question ---------- */
function startRename() {
  const b = state.branches.find((x) => x.id === state.open);
  const span = document.querySelector('#panelHead .btitle');
  if (!b || !span) return;
  const inp = document.createElement('input');
  inp.className = 'rename'; inp.maxLength = 80; inp.value = b.title || ''; inp.placeholder = plain(defaultTitle(b)).slice(0, 80);
  inp.title = t('renameHint');
  span.parentElement.replaceWith(inp);
  inp.focus(); inp.select();
  let done = false;
  const finish = async (save) => {
    if (done) return; done = true;
    const value = inp.value.replace(/\s+/g, ' ').trim();
    if (save && value !== (b.title || '')) {
      try {
        const r = await (await api('/api/branch/' + b.id, { method: 'PATCH', body: JSON.stringify({ session: state.session, title: value }) })).json();
        if (r.title) b.title = r.title; else delete b.title;
      } catch (err) { toast(String(err.message || err).slice(0, 160)); }
    }
    renderPanel();
  };
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
  });

}

/* ---------- keyboard shortcuts: B branch from selection, / search, Esc back/close ---------- */
document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
  if (e.key === 'Escape') {
    if (document.querySelector('.modal-bg')) return; // the modal handles its own Esc
    if (pendingSel && fb.style.display !== 'none') { fb.style.display = 'none'; pendingSel = null; window.getSelection().removeAllRanges(); return; }
    if (typing) { document.activeElement.blur(); return; }
    if (state.draft || state.open) { state.open = null; state.draft = null; renderThread(true); renderPanel(); }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  // B branches from a text selection in the page even if the question box still has focus
  // (text selected inside an input never shows up in getSelection(), so typing a "b" there is unaffected)
  const pageSel = pendingSel && window.getSelection().toString().trim() === pendingSel.text;
  if ((e.key === 'b' || e.key === 'B') && pageSel) { e.preventDefault(); fb.click(); return; }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); $('#search').focus(); }
});

/* ---------- click delegation ---------- */
document.addEventListener('click', async (e) => {
  const el = e.target;
  const twig = el.closest('.twig-hit, mark.twig-mark, [data-open]');
  if (twig) { openBranch(twig.dataset.b || twig.dataset.open); return; }
  const act = el.closest('[data-act]');
  if (act) { startDraft(Number(act.dataset.act), ''); return; }
  const go = el.closest('[data-goto]');
  if (go) { gotoMsg(Number(go.dataset.goto)); return; }
  if (el.closest('[data-rename]')) { startRename(); return; }
  if (el.closest('#backList')) { state.open = null; state.draft = null; renderThread(true); renderPanel(); return; }
  if (el.closest('#closePanel')) { $('#panel').classList.add('closed'); return; }
  if (el.closest('#delBranch')) {
    const b = state.branches.find((x) => x.id === state.open);
    if (!b || !confirm(t('confirmDelete'))) return;
    try { await api(`/api/branch/${b.id}?session=${encodeURIComponent(state.session)}`, { method: 'DELETE' }); }
    catch (err) { toast(String(err.message || err).slice(0, 160)); return; }
    const gone = new Set([b.id]);
    let grew = true;
    while (grew) { grew = false; for (const x of state.branches) if (x.parent && gone.has(x.parent) && !gone.has(x.id)) { gone.add(x.id); grew = true; } }
    state.branches = state.branches.filter((x) => !gone.has(x.id)); state.open = null;
    renderThread(true); renderPanel(); return;
  }
  if (el.closest('#exportBtn')) {
    const b = state.branches.find((x) => x.id === state.open);
    if (b) exportBranch(b);
    return;
  }
  if (el.closest('#noteBtn')) {
    const b = state.branches.find((x) => x.id === state.open);
    if (!b) return;
    const btn = el.closest('#noteBtn'); btn.disabled = true;
    const m = showNote(b);
    try {
      const r = await api(`/api/branch/${b.id}/note`, { method: 'POST', body: JSON.stringify({ session: state.session }) });
      const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '', text = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let k;
        while ((k = buf.indexOf('\n')) >= 0) {
          const ev = JSON.parse(buf.slice(0, k)); buf = buf.slice(k + 1);
          if (ev.type === 'delta') { text += ev.text; m.update(text); }
          else if (ev.type === 'done') m.finish(ev.note || text, ev.dir);
          else if (ev.type === 'error') m.fail(ev.error);
        }
      }
    } catch (err) { m.fail(String(err.message || err)); }
    finally { btn.disabled = false; }
    return;
  }
  if (el.closest('#summaryBtn')) {
    const b = state.branches.find((x) => x.id === state.open);
    if (!b) return;
    const btn = el.closest('#summaryBtn'); btn.disabled = true;
    // Open the window right away and stream the summary into it
    const m = showSummary();
    try {
      const r = await api(`/api/branch/${b.id}/summary`, { method: 'POST', body: JSON.stringify({ session: state.session }) });
      const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '', text = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let k;
        while ((k = buf.indexOf('\n')) >= 0) {
          const ev = JSON.parse(buf.slice(0, k)); buf = buf.slice(k + 1);
          if (ev.type === 'delta') { text += ev.text; m.update(text); }
          else if (ev.type === 'done') m.finish(ev.summary || text);
          else if (ev.type === 'error') m.fail(ev.error);
        }
      }
    } catch (err) { m.fail(String(err.message || err)); }
    finally { btn.disabled = false; }
    return;
  }
  if (el.closest('#toTerminal')) {
    const b = state.branches.find((x) => x.id === state.open);
    if (!b) return;
    try {
      const r = await (await api(`/api/branch/${b.id}/terminal`, { method: 'POST', body: JSON.stringify({ session: state.session }) })).json();
      if (r.opened) toast(t('terminalOpened') + (r.via ? ' (' + r.via + ')' : ''));
      else {
        try { await navigator.clipboard.writeText(r.command); toast(t('terminalCopied')); }
        catch { prompt(t('terminalPrompt'), r.command); }
      }
    }
    catch (err) { toast(String(err.message || err)); }
  }
});

/* ---------- input ---------- */
const input = $('#input');
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(180, input.scrollHeight) + 'px'; }
input.addEventListener('input', autosize);

/* ---------- image attachments: paste, drop or the clip button; shrunk to at most 1568px before sending ---------- */
const MAX_IMAGES = 4, MAX_EDGE = 1568, IMG_OK = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
const attach = []; // { media_type, data (base64), url (object URL for preview) }
function imgSrc(b, name) { return /^(blob|data):/.test(name) ? name : `/img/${b.id}/${encodeURIComponent(name)}?t=${BOOT.token}`; }
function imagesHtml(b, list) {
  if (!list || !list.length) return '';
  return '<div class="bimgs">' + list.map((n) => { const src = esc(imgSrc(b, n)); return `<a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt=""></a>`; }).join('') + '</div>';
}
function renderAttach() {
  $('#attachRow').innerHTML = attach.map((a, i) => `<div class="th"><img src="${esc(a.url)}" alt=""><button data-unattach="${i}" title="${esc(t('removeImage'))}">✕</button></div>`).join('');
}
async function toPayload(file) {
  // Shrink big images (Claude downsizes past ~1568px anyway) and keep each request small
  let blob = file, type = file.type;
  const bmp = await createImageBitmap(file).catch(() => null);
  if (bmp && (Math.max(bmp.width, bmp.height) > MAX_EDGE || file.size > 3.5e6 || type === 'image/gif')) {
    const k = Math.min(1, MAX_EDGE / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    type = type === 'image/jpeg' ? 'image/jpeg' : 'image/png';
    blob = await new Promise((r) => c.toBlob(r, type, 0.9));
  }
  if (!blob || blob.size > 5e6) throw new Error(t('imageTooLarge'));
  const data = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
  return { media_type: type, data, url: URL.createObjectURL(blob) };
}
async function addImages(files) {
  const list = [...files].filter((x) => IMG_OK.includes(x.type));
  if (!list.length) return false;
  for (const file of list) {
    if (attach.length >= MAX_IMAGES) { toast(t('tooManyImages')); break; }
    try { attach.push(await toPayload(file)); } catch (e) { toast(String(e.message || e)); }
  }
  renderAttach(); input.focus();
  return true;
}
input.addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.items || [])].filter((it) => it.kind === 'file').map((it) => it.getAsFile()).filter(Boolean);
  if (files.some((x) => IMG_OK.includes(x.type))) { e.preventDefault(); addImages(files); }
});
$('#attachBtn').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', (e) => { addImages(e.target.files); e.target.value = ''; });
$('#attachRow').addEventListener('click', (e) => {
  const x = e.target.closest('[data-unattach]');
  if (!x) return;
  const [a] = attach.splice(Number(x.dataset.unattach), 1);
  if (a) URL.revokeObjectURL(a.url);
  renderAttach();
});
const comp = $('#composer');
['dragenter', 'dragover'].forEach((ev) => $('#panel').addEventListener(ev, (e) => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); comp.classList.add('dragging'); } }));
['dragleave', 'drop'].forEach((ev) => $('#panel').addEventListener(ev, () => comp.classList.remove('dragging')));
$('#panel').addEventListener('drop', (e) => { if (e.dataTransfer?.files?.length) { e.preventDefault(); if (!comp.classList.contains('hidden')) addImages(e.dataTransfer.files); } });
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); sendQuestion(); }
});
$('#send').addEventListener('click', sendQuestion);
let searchT = 0;
$('#search').addEventListener('input', () => {
  clearTimeout(searchT);
  searchT = setTimeout(() => { renderThread(true); if (!state.open && !state.draft) renderPanel(); }, 150);
});
/* ---------- model + effort picker, like Claude Code's /model: ↑↓ model, ←→ effort, Enter/Esc close ---------- */
const pick = { model: '@main', effort: '' };
let MODELS = [];          // from /api/models: what this Claude Code resolves each alias to
const EFFORTS = ['low', 'medium', 'high', 'xhigh', 'max'];
const labelOf = (id) => { const m = String(id || '').replace(/^claude-/, '').match(/^([a-z]+)-([\d-]+)/); return m ? m[1][0].toUpperCase() + m[1].slice(1) + ' ' + m[2].replace(/-/g, '.') : (id || '?'); };
function effortsFor(model) {
  if (model === '@main') { const m = MODELS.find((x) => x.id === state.mainSpec?.model); return m ? m.efforts : EFFORTS; }
  const m = MODELS.find((x) => x.value === model);
  return m ? m.efforts : EFFORTS;
}
// What actually runs for a model/effort choice: { name, effort }
function resolveSpec(model, effort) {
  if (model === '@main' && state.mainSpec?.model) return { name: labelOf(state.mainSpec.model), effort: effort || state.mainSpec.effort || '' };
  if (model === '@main') model = ''; // main conversation's model unknown: same as the Claude Code default
  const m = MODELS.find((x) => x.value === model) || (!model && MODELS.find((x) => x.isDefault));
  if (!m) return { name: model || t('cliDefault'), effort };
  return { name: m.label + (m.ctx1m ? ' 1M' : ''), effort: effort || m.defaultEffort };
}
function renderModelBtn() {
  const r = resolveSpec(pick.model, pick.effort);
  $('#modelBtn').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>${esc((pick.model === '@main' ? t('mainShort') + ' · ' : '') + r.name + (r.effort ? ' · ' + r.effort : ''))}`;
}
function modelRows() {
  const rows = [{ value: '@main', label: t('sameAsMain'), sub: state.mainSpec?.model ? labelOf(state.mainSpec.model) + (state.mainSpec.effort ? ' · ' + state.mainSpec.effort : '') : '' }];
  for (const m of MODELS) rows.push({ value: m.value, label: m.isDefault ? t('cliDefault') : m.label + (m.ctx1m ? ' (1M context)' : ''), sub: m.isDefault ? m.label : (m.value === 'haiku' ? t('fastest') : '') });
  return rows;
}
let popEl = null, hl = 0;
function setPick(model, effort) {
  pick.model = model; pick.effort = effort;
  const lv = effortsFor(model); if (pick.effort && !lv.includes(pick.effort)) pick.effort = '';
  try { localStorage.setItem('tangent-spec-model', pick.model); localStorage.setItem('tangent-spec-effort', pick.effort); } catch {}
  const b = state.draft || state.branches.find((x) => x.id === state.open);
  if (b) { b.model = pick.model; b.effort = pick.effort; }
  renderModelBtn(); if (popEl) renderPop();
}
function renderPop() {
  const rows = modelRows();
  const lv = effortsFor(pick.model), stops = ['', ...lv], at = stops.indexOf(pick.effort);
  const r = resolveSpec(pick.model, pick.effort);
  const shown = pick.effort ? pick.effort : (t('effortAuto') + (r.effort ? ' (' + r.effort + ')' : ''));
  popEl.innerHTML = `<h4>${esc(t('modelTitle'))}</h4>` +
    rows.map((x, i) => `<div class="opt${i === hl ? ' hl' : ''}" data-mv="${esc(x.value)}"><span class="ck">${x.value === pick.model ? '✓' : ''}</span><span>${esc(x.label)}</span><span class="sub">${esc(x.sub || '')}</span></div>`).join('') +
    (MODELS.length ? '' : `<div class="keys">${esc(t('modelsLoading'))}</div>`) +
    (lv.length
      ? `<div class="eff"><span class="lbl">Effort</span><button data-eff="-1" ${at <= 0 ? 'disabled' : ''}>◀</button><span class="dots">${lv.map((e, i) => `<i class="${at > 0 && i < at ? 'on' : ''}"></i>`).join('')}</span><button data-eff="1" ${at >= stops.length - 1 ? 'disabled' : ''}>▶</button><span class="val">${esc(shown)}</span></div>`
      : `<div class="eff"><span class="lbl">${esc(t('noEffort'))}</span></div>`) +
    `<div class="keys">${esc(t('pickerKeys'))}</div>`;
}
function stepEffort(d) {
  const stops = ['', ...effortsFor(pick.model)];
  const i = Math.max(0, Math.min(stops.length - 1, stops.indexOf(pick.effort) + d));
  setPick(pick.model, stops[i]);
}
function openPop() {
  if (popEl) return closePop();
  popEl = document.createElement('div'); popEl.className = 'mpop';
  hl = Math.max(0, modelRows().findIndex((x) => x.value === pick.model));
  $('#composer').appendChild(popEl); renderPop();
  if (!MODELS.length) loadModels().then(() => popEl && renderPop());
}
function closePop() { if (popEl) { popEl.remove(); popEl = null; } }
async function loadModels() {
  try { const r = await (await api('/api/models')).json(); MODELS = r.models || []; renderModelBtn(); } catch {}
}
$('#modelBtn').addEventListener('click', (e) => { e.stopPropagation(); openPop(); });
document.addEventListener('mousedown', (e) => { if (popEl && !e.target.closest('.mpop, #modelBtn')) closePop(); });
document.addEventListener('click', (e) => {
  if (!popEl) return;
  const o = e.target.closest('.mpop [data-mv]'); if (o) { setPick(o.dataset.mv, pick.effort); hl = modelRows().findIndex((x) => x.value === pick.model); renderPop(); return; }
  const b = e.target.closest('.mpop [data-eff]'); if (b) stepEffort(Number(b.dataset.eff));
});
document.addEventListener('keydown', (e) => {
  if (!popEl) return;
  const rows = modelRows();
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); e.stopImmediatePropagation(); hl = (hl + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length; setPick(rows[hl].value, pick.effort); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); e.stopImmediatePropagation(); stepEffort(e.key === 'ArrowRight' ? 1 : -1); }
  else if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); closePop(); $('#input').focus(); }
}, true);
$('#sessionSel').addEventListener('change', (e) => { state.session = e.target.value; state.open = null; state.draft = null; loadThread(true); });
$('#reload').addEventListener('click', () => loadThread(false).then(() => toast(t('reloaded'))));
$('#theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('tangent-theme', root.dataset.theme); } catch {}
});
try { const th = localStorage.getItem('tangent-theme'); if (th) document.documentElement.dataset.theme = th; } catch {}
let toastT = 0;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }

$('#readTools').addEventListener('change', (e) => {
  try { localStorage.setItem('tangent-readtools', e.target.checked ? '1' : '0'); } catch {}
  const b = state.draft || state.branches.find((x) => x.id === state.open);
  if (b) b.readTools = e.target.checked;
});

/* ---------- "Bring back" summary: review, edit, copy, paste into the main session ---------- */
// Opens at once in a "writing" state; update() streams text in, finish() makes it editable, fail() shows the error.
function showNote(b) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="width:min(760px,100%)"><h3>${TWIG_ICO}${esc(t('noteHeading'))}</h3><p>${esc(t('noteHint'))}</p><textarea readonly style="min-height:340px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:12.5px"></textarea><div class="row-btns"><button class="btn" data-folder style="margin-right:auto">${esc(t('openFolder'))}</button><button class="btn" data-x>${esc(t('close'))}</button><button class="btn primary" data-save disabled>${esc(t('saveNote'))}</button></div></div>`;
  const ta = bg.querySelector('textarea'), saveBtn = bg.querySelector('[data-save]'), hint = bg.querySelector('p');
  ta.placeholder = t('noteWriting');
  let closed = false, saved = false;
  const close = () => { closed = true; bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  bg.addEventListener('click', async (e) => {
    if (e.target === bg || e.target.closest('[data-x]')) return close();
    if (e.target.closest('[data-folder]')) { api('/api/notes/open', { method: 'POST' }).catch(() => {}); return; }
    if (e.target.closest('[data-save]') && !saved) {
      saveBtn.disabled = true;
      try {
        const r = await (await api(`/api/branch/${b.id}/note-save`, { method: 'POST', body: JSON.stringify({ session: state.session, content: ta.value }) })).json();
        saved = true; saveBtn.textContent = t('noteSaved');
        hint.textContent = t('noteSavedAt') + r.file; hint.style.color = 'var(--twig)';
        (b.notes ||= []).push({ file: r.file, time: new Date().toISOString() });
        toast(t('noteSaved'));
      } catch (err) { saveBtn.disabled = false; toast(String(err.message || err).slice(0, 160)); }
    }
  });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(bg);
  api('/api/notes/dir').then((r) => r.json()).then((r) => { if (!closed && !saved) hint.textContent = t('noteHint') + ' ' + t('noteWhere') + r.dir; }).catch(() => {});
  return {
    update(text) { if (!closed) { ta.value = text; ta.scrollTop = ta.scrollHeight; } },
    finish(text) { if (closed) return; ta.value = text; ta.readOnly = false; saveBtn.disabled = false; ta.scrollTop = 0; ta.focus(); },
    fail(msg) { if (closed) return; ta.placeholder = ''; hint.textContent = t('noteFailed') + String(msg).slice(0, 200); hint.style.color = '#B3261E'; },
  };
}

function showSummary() {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${TWIG_ICO}${esc(t('summaryHeading'))}</h3><p>${esc(t('summaryHint'))}</p><textarea readonly></textarea><div class="row-btns"><button class="btn" data-x>${esc(t('close'))}</button><button class="btn primary" data-copy disabled>${esc(t('copy'))}</button></div></div>`;
  const ta = bg.querySelector('textarea'), copyBtn = bg.querySelector('[data-copy]'), hint = bg.querySelector('p');
  ta.placeholder = t('summarizing');
  let closed = false;
  const close = () => { closed = true; bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  bg.addEventListener('click', async (e) => {
    if (e.target === bg || e.target.closest('[data-x]')) return close();
    if (e.target.closest('[data-copy]')) {
      try { await navigator.clipboard.writeText(ta.value); } catch { ta.select(); document.execCommand('copy'); }
      toast(t('copied')); close();
    }
  });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(bg);
  return {
    update(text) { if (!closed) { ta.value = text; ta.scrollTop = ta.scrollHeight; } },
    finish(text) { if (closed) return; ta.value = text; ta.readOnly = false; copyBtn.disabled = false; ta.focus(); },
    fail(msg) { if (closed) return; ta.placeholder = ''; ta.value = ''; hint.textContent = t('summaryFailed') + String(msg).slice(0, 200); hint.style.color = '#B3261E'; },
  };
}

$('#lang').addEventListener('click', () => {
  LANG = LANG === 'ko' ? 'en' : 'ko';
  try { localStorage.setItem('tangent-lang', LANG); } catch {}
  applyI18n(); renderThread(true); renderPanel(); loadSessions().catch(() => {});
});

/* ---------- start ---------- */
applyI18n();
if (BOOT && BOOT.version) $('#ver').textContent = 'v' + BOOT.version;
loadModels();
(async () => {
  try {
    await loadSessions();
    await loadThread(true);
    $('#panel').classList.remove('closed');
    renderPanel();
    const hb = (location.hash.match(/b=([a-z0-9]+)/) || [])[1];
    const target = hb && state.branches.find((x) => x.id === hb);
    if (target) { openBranch(target.id); gotoMsg(target.anchor, true); }
  } catch (e) { $('#thread').innerHTML = `<div class="empty">${t('loadFailed')}${esc(String(e.message || e))}</div>`; }
})();
</script>
